name: yt-discord-notify

on:
  schedule:
    # de 5 em 5 min: live perde valor se o aviso chega tarde.
    # o agendador do GitHub ainda atrasa alguns minutos por conta propria.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rodar notificador
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}              # #videos-novos (MCD ANIMES)
          DISCORD_WEBHOOK_OUTRO: ${{ secrets.DISCORD_WEBHOOK_OUTRO }}  # #outro-mcd
          DISCORD_WEBHOOK_LIVES: ${{ secrets.DISCORD_WEBHOOK_LIVES }}  # #lives
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python notify.py
      - name: Salvar estado
        run: |
          git config user.name "yt-notify-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "update state [skip ci]" && git push)
